name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check signing selection
        run: node --test scripts/signing-selection.test.mjs
      - name: Check tag release scripts
        run: node --test scripts/tag-release.test.mjs
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" || exit
          done

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Remove untrusted runner tap
        run: brew untap aws/tap || true

      - name: Install tools
        run: brew install swiftformat swiftlint

      - name: Lint
        run: make lint

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Remove untrusted runner tap
        run: brew untap aws/tap || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Build and test
        run: make test

      - name: Build Release
        run: make release
