name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Remove untrusted runner tap
        run: brew untap aws/tap || true

      - name: Install tools
        run: brew install swiftformat swiftlint

      - name: Lint
        run: make lint

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Remove untrusted runner tap
        run: brew untap aws/tap || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Verify generated Xcode files
        run: |
          project_changes="$(git status --porcelain --untracked-files=all -- Clipped/Clipped.xcodeproj Clipped/Resources/Clipped.entitlements)"
          if [[ -n "$project_changes" ]]; then
            git status --short -- Clipped/Clipped.xcodeproj Clipped/Resources/Clipped.entitlements
            git diff HEAD -- Clipped/Clipped.xcodeproj Clipped/Resources/Clipped.entitlements
            echo "Generated Xcode files are out of sync. Run make generate and commit its generated changes." >&2
            exit 1
          fi

      - name: Build and test
        run: make test

      - name: Build Release
        run: make release
