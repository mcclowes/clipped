name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-helper:
    name: Version helper regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bash -n scripts/bump-version.sh
      - run: node --test scripts/bump-version.test.mjs

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Remove untrusted runner tap
        run: brew untap aws/tap || true

      - name: Install tools
        run: brew install swiftformat swiftlint shellcheck

      - name: Check local build paths
        run: |
          bash -n scripts/build-products-dir.sh scripts/test-build-paths.sh
          shellcheck scripts/build-products-dir.sh scripts/test-build-paths.sh
          make test-build-paths DEVELOPER_ID_TEAM=

      - name: Lint
        run: make lint

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Remove untrusted runner tap
        run: brew untap aws/tap || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Verify generated Xcode files
        run: |
          project_changes="$(git status --porcelain --untracked-files=all -- Clipped/Clipped.xcodeproj Clipped/Resources/Clipped.entitlements)"
          if [[ -n "$project_changes" ]]; then
            git status --short -- Clipped/Clipped.xcodeproj Clipped/Resources/Clipped.entitlements
            git diff HEAD -- Clipped/Clipped.xcodeproj Clipped/Resources/Clipped.entitlements
            echo "Generated Xcode files are out of sync. Run make generate and commit its generated changes." >&2
            exit 1
          fi

      - name: Build and test
        run: make test

      - name: Build Release
        run: make release
