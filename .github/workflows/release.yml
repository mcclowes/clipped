name: Release

on:
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false
      candidate:
        type: string
        default: ""
      fingerprint:
        type: string
        default: ""
      nightly_tag:
        type: string
        default: ""
      nightly_version:
        type: string
        default: ""
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  build:
    runs-on: macos-15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NIGHTLY_SHA: ${{ inputs.candidate }}
      NIGHTLY_FINGERPRINT: ${{ inputs.fingerprint }}
      NIGHTLY_TAG: ${{ inputs.nightly_tag }}
      NIGHTLY_VERSION: ${{ inputs.nightly_version }}
      NIGHTLY_TAP_PATH: ${{ github.workspace }}/nightly-tap
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Run tests
        run: make test

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build and sign release
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          nightly_version_args=()
          if [ -n "$NIGHTLY_VERSION" ]; then
            nightly_version_args=(MARKETING_VERSION="$NIGHTLY_VERSION" CURRENT_PROJECT_VERSION="$NIGHTLY_VERSION")
          fi
          xcodebuild -project Clipped/Clipped.xcodeproj \
            -scheme Clipped \
            -configuration Release \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build "${nightly_version_args[@]}"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUILD_DIR=$(xcodebuild -project Clipped/Clipped.xcodeproj -scheme Clipped -configuration Release -showBuildSettings 2>/dev/null | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $NF}')
          APP_PATH="$BUILD_DIR/Clipped.app"

          # Create zip for notarization
          ditto -c -k --keepParent "$APP_PATH" "$BUILD_DIR/Clipped.zip"

          # Submit for notarization
          SUBMISSION_OUTPUT=$(xcrun notarytool submit "$BUILD_DIR/Clipped.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1) || true
          echo "$SUBMISSION_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep -m1 'id:' | awk '{print $NF}')

          if echo "$SUBMISSION_OUTPUT" | grep -q "status: Invalid"; then
            echo "Notarization failed — fetching log:"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$TEAM_ID"
            exit 1
          fi

          # Staple the ticket to the app
          xcrun stapler staple "$APP_PATH"

          # Re-create zip with stapled app
          rm "$BUILD_DIR/Clipped.zip"
          ditto -c -k --keepParent "$APP_PATH" "$BUILD_DIR/Clipped.zip"

      - name: Find artifact
        id: artifact
        run: |
          BUILD_DIR=$(xcodebuild -project Clipped/Clipped.xcodeproj -scheme Clipped -configuration Release -showBuildSettings 2>/dev/null | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $NF}')
          release_architectures=$(lipo -archs "${BUILD_DIR}/Clipped.app/Contents/MacOS/Clipped")
          cask_arches=""
          for release_arch in $release_architectures; do
            case "$release_arch" in
              arm64|x86_64) cask_arches="${cask_arches:+$cask_arches, }:$release_arch" ;;
              *) echo "Unsupported release architecture: $release_arch" >&2; exit 1 ;;
            esac
          done
          if [ -z "$cask_arches" ]; then
            echo "Release binary contains no supported architectures" >&2
            exit 1
          fi
          {
            echo "cask_arches=$cask_arches"
            echo "zip_path=${BUILD_DIR}/Clipped.zip"
            echo "sha256=$(shasum -a 256 "${BUILD_DIR}/Clipped.zip" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ !inputs.nightly }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          files: ${{ steps.artifact.outputs.zip_path }}
          body: |
            ## Clipped ${{ github.ref_name }}

            **Install via Homebrew:**
            ```
            brew install mcclowes/clipped/clipped
            ```

            **SHA256:** `${{ steps.artifact.outputs.sha256 }}`
          draft: false
          prerelease: false

      - name: Update Homebrew tap
        if: ${{ !inputs.nightly }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          CASK_CONTENT=$(cat <<CASKEOF
          cask "clipped" do
            version "${{ github.ref_name }}"
            sha256 "${{ steps.artifact.outputs.sha256 }}"

            url "https://github.com/mcclowes/clipped/releases/download/${{ github.ref_name }}/Clipped.zip"
            name "Clipped"
            desc "Clipboard manager"
            homepage "https://github.com/mcclowes/clipped"

            depends_on arch: [${{ steps.artifact.outputs.cask_arches }}]
            depends_on macos: :sequoia

            app "Clipped.app"

            zap trash: [
              "~/Library/Application Support/Clipped",
              "~/Library/Preferences/com.mcclowes.Clipped.plist",
            ]
          end
          CASKEOF
          )

          # Get current file SHA for the update API call
          FILE_SHA=$(gh api repos/mcclowes/homebrew-clipped/contents/Casks/clipped.rb -q .sha 2>/dev/null || echo "")

          if [ -n "$FILE_SHA" ]; then
            gh api repos/mcclowes/homebrew-clipped/contents/Casks/clipped.rb \
              -X PUT \
              -f message="Update clipped to ${{ github.ref_name }}" \
              -f content="$(echo "$CASK_CONTENT" | base64)" \
              -f sha="$FILE_SHA"
          else
            gh api repos/mcclowes/homebrew-clipped/contents/Casks/clipped.rb \
              -X PUT \
              -f message="Add clipped ${{ github.ref_name }}" \
              -f content="$(echo "$CASK_CONTENT" | base64)"
          fi

      - name: Check out the nightly tap
        if: ${{ inputs.nightly }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mcclowes/homebrew-clipped
          path: nightly-tap
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Publish the verified nightly
        if: ${{ inputs.nightly }}
        env:
          TAP_GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NIGHTLY_ARTIFACT: ${{ steps.artifact.outputs.zip_path }}
        run: node scripts/nightly-release.mjs publish

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
